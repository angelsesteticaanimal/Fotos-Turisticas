<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#087ea4" />
  <title>Foto Turismo</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <div>
    <strong>Foto Turismo</strong>
    <small>Fotos com molduras turísticas</small>
  </div>
  <button id="installBtn" hidden>Instalar</button>
</header>

<main>
  <section class="stage-card">
    <canvas id="canvas" width="1122" height="1402" aria-label="Pré-visualização da foto"></canvas>
    <p class="hint">Arraste a foto com um dedo. Use dois dedos para ampliar ou reduzir.</p>
  </section>

  <section class="controls">
    <div class="button-grid">
      <label class="primary file-btn">📷 Fotografar
        <input id="cameraInput" type="file" accept="image/*" capture="environment" />
      </label>
      <label class="file-btn">🖼️ Galeria
        <input id="galleryInput" type="file" accept="image/*" />
      </label>
      <button id="fitBtn">↔ Ajustar</button>
      <button id="rotateBtn">↻ Girar</button>
    </div>

    <div class="range-row">
      <label>Zoom <input id="zoom" type="range" min="0.4" max="4" step="0.01" value="1" /></label>
      <label>Brilho <input id="brightness" type="range" min="60" max="140" step="1" value="100" /></label>
      <label>Contraste <input id="contrast" type="range" min="60" max="140" step="1" value="100" /></label>
    </div>

    <h2>Molduras</h2>
    <div id="frames" class="frames"></div>

    <div class="button-grid action-grid">
      <button id="saveBtn" class="primary">💾 Salvar foto</button>
      <button id="shareBtn">📤 Compartilhar</button>
      <button id="resetBtn">🧹 Limpar</button>
    </div>
  </section>
</main>

<footer>Versão 1.0 • Cabo Frio e Região dos Lagos</footer>
<script src="app.js"></script>
</body>
</html>
